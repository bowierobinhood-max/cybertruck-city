<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const elSpd = document.getElementById('spd');
const elAlt = document.getElementById('alt');
const elScore = document.getElementById('score');
const missionBox = document.getElementById('missionBox');
const mTitle = document.getElementById('mTitle');
const mDesc = document.getElementById('mDesc');
const toastEl = document.getElementById('toast');
const menuEl = document.getElementById('menu');
const pauseOverlay = document.getElementById('pauseOverlay');
const speedFill = document.getElementById('speedFill');
const menuBtn = document.getElementById('menuBtn');
const qualBtn = document.getElementById('qualBtn');
const fpsEl = document.getElementById('fps');

function toast(msg, ms=1800){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}

const QUAL = {
  high: { pr:1.5, shadows:true, shadowSize:1024, far:920, fogN:0.00085, fogD:0.00055, blocks:5, perBlock:4, extraTowers:12, lamps:true, streetLamps:true, lampLights:8, antialias:true, treeCount:14, coins:22, headlight:true, tone:2, taxis:10, signs:5, sidewalks:true, parked:18, traffic:true },
  med:  { pr:1, shadows:false, shadowSize:512, far:640, fogN:0.00125, fogD:0.0008, blocks:4, perBlock:3, extraTowers:8, lamps:true, streetLamps:true, lampLights:0, antialias:false, treeCount:8, coins:16, headlight:false, tone:2, taxis:6, signs:4, sidewalks:true, parked:10, traffic:true },
  low:  { pr:1, shadows:false, shadowSize:256, far:460, fogN:0.0018, fogD:0.00115, blocks:3, perBlock:2, extraTowers:4, lamps:true, streetLamps:false, lampLights:0, antialias:false, treeCount:4, coins:10, headlight:false, tone:1, taxis:2, signs:3, sidewalks:false, parked:4, traffic:false },
};
let quality = localStorage.getItem('fcc_quality') || 'med';
if(!QUAL[quality]) quality = 'med';

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: QUAL[quality].antialias, powerPreference:'high-performance',
  alpha:false, stencil:false, depth:true
});
renderer.setClearColor(0x0a1220, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1220);
scene.fog = new THREE.FogExp2(0x0a1220, 0.0012);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.8, QUAL[quality].far);

const hemi = new THREE.HemisphereLight(0x9ec4ff, 0x2a2030, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b8, 1.05);
sun.position.set(160, 260, 80);
sun.castShadow = false;
scene.add(sun);
const amb = new THREE.AmbientLight(0x334466, 0.32);
scene.add(amb);
const fill = new THREE.DirectionalLight(0x88aacc, 0.25);
fill.position.set(-80, 60, -40);
scene.add(fill);

let isNight = true;

/* Wider denser US city */
const CITY = 560;
const BLOCK = 72;
const ROAD_W = 22;
const SIDE_ROAD = 16;
const SIDEWALK = 4.5;

function noise(g,w,h,alpha=28){
  const img=g.getImageData(0,0,w,h); const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()*2-1)*alpha;
    d[i]=Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
  }
  g.putImageData(img,0,0);
}

function makeWindowTexture(night, size, style){
  const w = size, h = size*2;
  const c = document.createElement('canvas');
  c.width=w; c.height=h;
  const g=c.getContext('2d');
  if(style==='brick'){
    g.fillStyle = night ? '#3a2a24' : '#8b5a44';
    g.fillRect(0,0,w,h);
    // mortar lines
    g.strokeStyle = night ? '#2a1c16' : '#6e4534';
    g.lineWidth=1;
    const cols=5, rows=10, cw=w/cols, rh=h/rows;
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const ox=(y%2)*(cw*0.5);
        const lit = night ? Math.random()>0.32 : Math.random()>0.88;
        g.fillStyle = lit ? (Math.random()>0.5?'#f0d080':'#ffe8a0') : (night?'#2a1e18':'#7a5040');
        g.fillRect(x*cw+ox+1, y*rh+2, cw-2, rh-4);
      }
    }
  } else {
    g.fillStyle = night ? '#152030' : '#5a7080';
    g.fillRect(0,0,w,h);
    // curtain wall mullions
    g.strokeStyle = night ? '#0a1018' : '#3a4c58';
    g.lineWidth=1;
    const cols=night?7:6, rows=night?14:12, cw=w/cols, rh=h/rows;
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
      const lit = night ? Math.random()>0.2 : Math.random()>0.82;
      if(!lit) g.fillStyle = night?'#0a121c':'#455868';
      else g.fillStyle = Math.random()>0.55 ? '#e8c070' : (Math.random()>0.5?'#a8d0f0':'#d0e8ff');
      g.fillRect(x*cw+1,y*rh+1,cw-2,rh-2);
    }
  }
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.magFilter=THREE.NearestFilter;
  tex.minFilter=THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps=true;
  return tex;
}

function makeAsphaltTex(){
  const c=document.createElement('canvas'); c.width=128; c.height=128;
  const g=c.getContext('2d');
  g.fillStyle='#1c2128'; g.fillRect(0,0,128,128);
  noise(g,128,128,18);
  // faint tar seams
  g.strokeStyle='#151920'; g.lineWidth=2;
  for(let i=0;i<6;i++){ g.beginPath(); g.moveTo(0,i*22+Math.random()*8); g.lineTo(128,i*22+Math.random()*8); g.stroke(); }
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(8,8);
  return tex;
}

function makeSidewalkTex(){
  const c=document.createElement('canvas'); c.width=64; c.height=64;
  const g=c.getContext('2d');
  g.fillStyle='#6a6e74'; g.fillRect(0,0,64,64);
  g.strokeStyle='#555860'; g.lineWidth=1;
  for(let i=0;i<=4;i++){ g.beginPath(); g.moveTo(i*16,0); g.lineTo(i*16,64); g.stroke();
    g.beginPath(); g.moveTo(0,i*16); g.lineTo(64,i*16); g.stroke(); }
  noise(g,64,64,12);
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(2,2);
  return tex;
}

function makeSkyTex(night){
  const c=document.createElement('canvas'); c.width=8; c.height=512;
  const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,0,512);
  if(night){
    grd.addColorStop(0,'#010308');
    grd.addColorStop(0.35,'#071028');
    grd.addColorStop(0.55,'#121e38');
    grd.addColorStop(0.78,'#1c2438');
    grd.addColorStop(1,'#2a2230');
  } else {
    grd.addColorStop(0,'#2a6cb8');
    grd.addColorStop(0.35,'#5a9ad0');
    grd.addColorStop(0.55,'#8ebfe0');
    grd.addColorStop(0.78,'#c8dde8');
    grd.addColorStop(1,'#e8d8c0');
  }
  g.fillStyle=grd; g.fillRect(0,0,8,512);
  if(night){
    g.fillStyle='#ffffff';
    for(let i=0;i<80;i++){
      const x=Math.random()*8, y=Math.random()*280, r=Math.random()*1.2;
      g.globalAlpha=0.3+Math.random()*0.7;
      g.fillRect(x,y,r,r);
    }
    g.globalAlpha=1;
  }
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.magFilter=THREE.LinearFilter;
  tex.minFilter=THREE.LinearFilter;
  return tex;
}

function makeSignTexture(text, bg, fg){
  const c=document.createElement('canvas');
  c.width=256; c.height=128;
  const g=c.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,256,128);
  g.strokeStyle='#ffffff55'; g.lineWidth=4; g.strokeRect(4,4,248,120);
  g.fillStyle=fg; g.font='bold 28px Arial,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  const lines=text.split('|');
  lines.forEach((ln,i)=> g.fillText(ln, 128, 64 + (i-(lines.length-1)/2)*32));
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.magFilter=THREE.LinearFilter;
  tex.generateMipmaps=false;
  return tex;
}

let dayGlass, nightGlass, dayBrick, nightBrick;
let buildingMatGlass, buildingMatBrick;
let buildingMeshGlass, buildingMeshBrick;
let asphaltTex, sidewalkTex, skyDayTex, skyNightTex;
const colliders = [];
const dummy = new THREE.Object3D();
const streetLampLights = [];

const groundMat = new THREE.MeshStandardMaterial({color:0x3a424c, metalness:0.05, roughness:0.95});
const roadMat = new THREE.MeshStandardMaterial({color:0xffffff, metalness:0.05, roughness:0.88});
const sidewalkMat = new THREE.MeshStandardMaterial({color:0xffffff, metalness:0.02, roughness:0.9});
const parkMat = new THREE.MeshStandardMaterial({color:0x2f6b3e, metalness:0.0, roughness:0.92});
const lineMat = new THREE.MeshBasicMaterial({color:0xd8c060});
const whiteLineMat = new THREE.MeshBasicMaterial({color:0xd8dce0});
const crosswalkMat = new THREE.MeshBasicMaterial({color:0xe8ecf0});
const lampPoleMat = new THREE.MeshStandardMaterial({color:0x2a2a2a, metalness:0.6, roughness:0.45});
const lampHeadMat = new THREE.MeshBasicMaterial({color:0xffe0a0});
const treeMat = new THREE.MeshStandardMaterial({color:0x1f6b3a, metalness:0, roughness:0.9});
const trunkMat = new THREE.MeshStandardMaterial({color:0x4a3020, metalness:0, roughness:0.95});
const waterMat = new THREE.MeshStandardMaterial({color:0x3a7aaa, metalness:0.35, roughness:0.25});
const taxiMat = new THREE.MeshStandardMaterial({color:0xf5c400, metalness:0.35, roughness:0.45});
const taxiDark = new THREE.MeshStandardMaterial({color:0x222222, metalness:0.2, roughness:0.7});
const curbMat = new THREE.MeshStandardMaterial({color:0x8a8e94, metalness:0.05, roughness:0.85});

const boxGeo = new THREE.BoxGeometry(1,1,1);
const planeGeo = new THREE.PlaneGeometry(1,1);
const cylGeo = new THREE.CylinderGeometry(0.5,0.5,1,6);
const sphereGeo = new THREE.SphereGeometry(0.5,6,4);
const wheelGeoCT = new THREE.CylinderGeometry(0.5,0.5,1,8);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(CITY*2.4, CITY*2.4), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* Sky dome */
const skyMat = new THREE.MeshBasicMaterial({side:THREE.BackSide, depthWrite:false, fog:false});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), skyMat);
sky.scale.setScalar(CITY * 1.55);
scene.add(sky);

const cityRoot = new THREE.Group();
scene.add(cityRoot);
const lampHeads = [];
const taxis = [];

function clearCity(){
  while(cityRoot.children.length){
    const o=cityRoot.children[0];
    cityRoot.remove(o);
    if(o.geometry && o.geometry!==boxGeo && o.geometry!==planeGeo && o.geometry!==cylGeo && o.geometry!==sphereGeo && o.geometry!==wheelGeoCT){
      try{ o.geometry.dispose(); }catch(e){}
    }
  }
  for(const L of streetLampLights){ scene.remove(L); try{L.dispose();}catch(e){} }
  streetLampLights.length=0;
  colliders.length=0; lampHeads.length=0; taxis.length=0;
  buildingMeshGlass=buildingMeshBrick=null;
}

function addCollider(x,z,w,d,h){
  const hw=w*0.48, hd=d*0.48;
  colliders.push({minx:x-hw,maxx:x+hw,miny:0,maxy:h,minz:z-hd,maxz:z+hd});
}

function addBillboard(x,y,z, yaw, tex){
  const mat=new THREE.MeshBasicMaterial({map:tex, side:THREE.DoubleSide});
  const m=new THREE.Mesh(planeGeo, mat);
  m.scale.set(28,14,1);
  m.position.set(x,y,z);
  m.rotation.y=yaw;
  cityRoot.add(m);
  const pole=new THREE.Mesh(cylGeo, lampPoleMat);
  pole.scale.set(0.5,y,0.5); pole.position.set(x,y*0.5,z); cityRoot.add(pole);
}

function roadPlane(x,z,w,d, mat, y=0.04){
  const m=new THREE.Mesh(planeGeo, mat);
  m.scale.set(w,d,1); m.rotation.x=-Math.PI/2; m.position.set(x,y,z);
  m.receiveShadow=true; cityRoot.add(m);
  return m;
}

function buildCity(q){
  clearCity();
  const half = q.blocks;
  const glassBuilds = [];
  const brickBuilds = [];

  if(asphaltTex) roadMat.map = asphaltTex;
  if(sidewalkTex) sidewalkMat.map = sidewalkTex;
  roadMat.needsUpdate = true; sidewalkMat.needsUpdate = true;

  /* —— Central Park —— */
  const park = new THREE.Mesh(planeGeo, parkMat);
  park.scale.set(100,100,1);
  park.rotation.x = -Math.PI/2;
  park.position.set(0,0.05,0);
  park.receiveShadow=true;
  cityRoot.add(park);

  const pathRing=new THREE.Mesh(new THREE.RingGeometry(22,26,24), new THREE.MeshStandardMaterial({color:0x6a5a48, roughness:0.95, metalness:0}));
  pathRing.rotation.x=-Math.PI/2; pathRing.position.y=0.06; cityRoot.add(pathRing);

  const fountainBase=new THREE.Mesh(cylGeo, new THREE.MeshStandardMaterial({color:0x9aa3b0, metalness:0.3, roughness:0.5}));
  fountainBase.scale.set(8,1.2,8); fountainBase.position.set(0,0.6,0); cityRoot.add(fountainBase);
  const pool=new THREE.Mesh(cylGeo, waterMat);
  pool.scale.set(6.5,0.4,6.5); pool.position.set(0,1.1,0); cityRoot.add(pool);
  const spout=new THREE.Mesh(cylGeo, new THREE.MeshStandardMaterial({color:0xb0b8c4, metalness:0.4, roughness:0.4}));
  spout.scale.set(0.8,3.5,0.8); spout.position.set(0,2.5,0); cityRoot.add(spout);

  for(let i=0;i<q.treeCount;i++){
    const a=Math.random()*Math.PI*2, r=16+Math.random()*30;
    const tx=Math.cos(a)*r, tz=Math.sin(a)*r;
    const trunk=new THREE.Mesh(cylGeo, trunkMat);
    trunk.scale.set(0.7,3+Math.random(),0.7); trunk.position.set(tx,1.5,tz); trunk.castShadow=q.shadows; cityRoot.add(trunk);
    const crown=new THREE.Mesh(sphereGeo, treeMat);
    const s=3.8+Math.random()*1.4;
    crown.scale.set(s,s,s); crown.position.set(tx,4.2,tz); crown.castShadow=q.shadows; cityRoot.add(crown);
  }

  /* —— Avenue grid + sidewalks —— */
  const span = CITY * 1.55;
  roadPlane(0,0,ROAD_W, span, roadMat);
  roadPlane(0,0,span, ROAD_W, roadMat);
  for(let i=-half;i<=half;i++){
    if(i===0) continue;
    const c=i*BLOCK;
    roadPlane(c,0,SIDE_ROAD, span*0.85, roadMat);
    roadPlane(0,c,span*0.85, SIDE_ROAD, roadMat);
  }

  if(q.sidewalks){
    // sidewalks flanking main avenues
    const sw = SIDEWALK;
    for(const ox of [ROAD_W*0.5+sw*0.5, -(ROAD_W*0.5+sw*0.5)]){
      roadPlane(ox, 0, sw, span*0.9, sidewalkMat, 0.055);
      roadPlane(0, ox, span*0.9, sw, sidewalkMat, 0.055);
    }
    for(let i=-half;i<=half;i++){
      if(i===0) continue;
      const c=i*BLOCK;
      for(const ox of [SIDE_ROAD*0.5+sw*0.5, -(SIDE_ROAD*0.5+sw*0.5)]){
        roadPlane(c+ox, 0, sw, span*0.7, sidewalkMat, 0.055);
        roadPlane(0, c+ox, span*0.7, sw, sidewalkMat, 0.055);
      }
    }
  }

  // yellow center dashes + white edge lines on main avenues
  for(let t=-CITY*0.72;t<CITY*0.72;t+=18){
    const ln=new THREE.Mesh(planeGeo, lineMat);
    ln.scale.set(0.9,5,1); ln.rotation.x=-Math.PI/2; ln.position.set(0,0.065,t); cityRoot.add(ln);
    const ln2=new THREE.Mesh(planeGeo, lineMat);
    ln2.scale.set(5,0.9,1); ln2.rotation.x=-Math.PI/2; ln2.position.set(t,0.065,0); cityRoot.add(ln2);
  }
  for(const ox of [ROAD_W*0.42, -ROAD_W*0.42]){
    const el=new THREE.Mesh(planeGeo, whiteLineMat);
    el.scale.set(0.35, span*0.85, 1); el.rotation.x=-Math.PI/2; el.position.set(ox,0.062,0); cityRoot.add(el);
    const el2=new THREE.Mesh(planeGeo, whiteLineMat);
    el2.scale.set(span*0.85, 0.35, 1); el2.rotation.x=-Math.PI/2; el2.position.set(0,0.062,ox); cityRoot.add(el2);
  }

  // crosswalks at park + every block intersection on main axes
  const cwSet = [[0,52],[0,-52],[52,0],[-52,0]];
  for(let i=-half;i<=half;i++){
    if(i===0) continue;
    const c=i*BLOCK;
    cwSet.push([0,c],[c,0]);
  }
  for(const [x,z] of cwSet){
    const alongZ = Math.abs(x)<1;
    for(let k=-3;k<=3;k++){
      const stripe=new THREE.Mesh(planeGeo, crosswalkMat);
      if(alongZ){ stripe.scale.set(ROAD_W*0.85,1.1,1); stripe.position.set(0,0.07,z+k*2.2); }
      else { stripe.scale.set(1.1,ROAD_W*0.85,1); stripe.position.set(x+k*2.2,0.07,0); }
      stripe.rotation.x=-Math.PI/2; cityRoot.add(stripe);
    }
  }

  /* —— Dense multi-building blocks —— */
  const offsets = [
    [0.26, 0.26], [0.26, -0.26], [-0.26, 0.26], [-0.26, -0.26],
    [0.0, 0.28], [0.0, -0.28], [0.28, 0.0], [-0.28, 0.0]
  ];
  for(let ix=-half;ix<=half;ix++){
    for(let iz=-half;iz<=half;iz++){
      if(Math.abs(ix)<1 && Math.abs(iz)<1) continue; // park
      const cx=ix*BLOCK, cz=iz*BLOCK;
      const dist = Math.abs(ix)+Math.abs(iz);
      const n = Math.min(q.perBlock, offsets.length);
      // shuffle-ish pick
      for(let bi=0; bi<n; bi++){
        const oi = ((bi*3 + (ix+iz+7)*2) % offsets.length + offsets.length) % offsets.length;
        const [ox,oz] = offsets[oi];
        // keep clear of road center
        let px = cx + ox * (BLOCK - ROAD_W*0.7);
        let pz = cz + oz * (BLOCK - ROAD_W*0.7);
        if(Math.abs(ix)<1){ px = (ox>0?1:-1) * (ROAD_W*0.5 + 18 + Math.random()*10); pz = cz + oz*(BLOCK*0.28); }
        if(Math.abs(iz)<1){ pz = (oz>0?1:-1) * (ROAD_W*0.5 + 18 + Math.random()*10); px = cx + ox*(BLOCK*0.28); }

        const downtown = dist <= 3;
        const isGlass = downtown ? Math.random()>0.25 : Math.random()>0.55;
        if(isGlass){
          const w=12+Math.random()*18, d=12+Math.random()*18;
          let h=28+Math.random()*Math.random()*160;
          if(downtown) h+=20+Math.random()*60;
          if(dist>5) h*=0.75;
          glassBuilds.push({x:px,z:pz,w,d,h,shade:0.72+Math.random()*0.35});
        } else {
          const w=10+Math.random()*10, d=10+Math.random()*12;
          const h=10+Math.random()*(downtown?36:24);
          brickBuilds.push({x:px,z:pz,w,d,h,shade:0.75+Math.random()*0.3});
        }
      }
    }
  }
  for(let i=0;i<q.extraTowers;i++){
    const a=Math.random()*Math.PI*2;
    const r=220+Math.random()*200;
    glassBuilds.push({
      x:Math.cos(a)*r, z:Math.sin(a)*r,
      w:14+Math.random()*22, d:14+Math.random()*22,
      h:80+Math.random()*160, shade:0.8+Math.random()*0.25
    });
  }

  function makeInstanced(list, mat){
    if(!list.length) return null;
    const mesh=new THREE.InstancedMesh(boxGeo, mat, list.length);
    mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    mesh.castShadow=q.shadows; mesh.receiveShadow=q.shadows;
    const color=new THREE.Color();
    for(let i=0;i<list.length;i++){
      const b=list[i];
      dummy.position.set(b.x, b.h*0.5, b.z);
      dummy.scale.set(b.w, b.h, b.d);
      dummy.rotation.set(0,0,0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      if(mat===buildingMatBrick) color.setHSL(0.05, 0.38, 0.34*b.shade);
      else color.setHSL(0.58, 0.1, 0.45*b.shade);
      mesh.setColorAt(i, color);
      addCollider(b.x,b.z,b.w,b.d,b.h);
    }
    mesh.instanceMatrix.needsUpdate=true;
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate=true;
    cityRoot.add(mesh);
    return mesh;
  }

  buildingMatGlass = new THREE.MeshStandardMaterial({
    color:0xffffff, map:nightGlass, emissive:0x1a2430,
    emissiveMap:nightGlass, emissiveIntensity:isNight?1.05:0.1,
    metalness:0.55, roughness:0.28
  });
  buildingMatBrick = new THREE.MeshStandardMaterial({
    color:0xffffff, map:nightBrick, emissive:0x2a1810,
    emissiveMap:nightBrick, emissiveIntensity:isNight?0.75:0.06,
    metalness:0.08, roughness:0.82
  });
  buildingMeshGlass = makeInstanced(glassBuilds, buildingMatGlass);
  buildingMeshBrick = makeInstanced(brickBuilds, buildingMatBrick);

  /* Park ring lamps */
  if(q.lamps){
    for(let a=0;a<Math.PI*2;a+=Math.PI/6){
      const x=Math.cos(a)*48, z=Math.sin(a)*48;
      const pole=new THREE.Mesh(cylGeo, lampPoleMat);
      pole.scale.set(0.32,7.5,0.32); pole.position.set(x,3.75,z); cityRoot.add(pole);
      const head=new THREE.Mesh(sphereGeo, lampHeadMat);
      head.scale.set(1.0,1.0,1.0); head.position.set(x,7.6,z); cityRoot.add(head);
      lampHeads.push(head);
    }
  }

  /* Street lamps along avenues */
  if(q.streetLamps){
    let lightBudget = q.lampLights;
    const spacing = quality==='high' ? 48 : 64;
    for(let t=-CITY*0.7; t<=CITY*0.7; t+=spacing){
      for(const [lx,lz,onX] of [[ROAD_W*0.55,t,true],[-ROAD_W*0.55,t,true],[t,ROAD_W*0.55,false],[t,-ROAD_W*0.55,false]]){
        if(Math.abs(t)<55) continue; // park area
        const pole=new THREE.Mesh(cylGeo, lampPoleMat);
        pole.scale.set(0.28,7,0.28); pole.position.set(lx,3.5,lz); cityRoot.add(pole);
        const arm=new THREE.Mesh(boxGeo, lampPoleMat);
        arm.scale.set(onX?1.6:0.25,0.18,onX?0.25:1.6);
        arm.position.set(lx+(onX?(lx>0?-0.6:0.6):0), 7.0, lz+(onX?0:(lz>0?-0.6:0.6)));
        cityRoot.add(arm);
        const head=new THREE.Mesh(sphereGeo, lampHeadMat);
        head.scale.set(0.7,0.5,0.7);
        head.position.set(arm.position.x, 6.85, arm.position.z);
        cityRoot.add(head); lampHeads.push(head);
        if(lightBudget>0 && isNight){
          const pl=new THREE.PointLight(0xffd8a0, 0.55, 42, 2);
          pl.position.copy(head.position);
          scene.add(pl); streetLampLights.push(pl); lightBudget--;
        }
      }
    }
  }

  /* Traffic lights at main intersections */
  if(q.traffic){
    for(const [x,z] of [[48,48],[48,-48],[-48,48],[-48,-48],[BLOCK,BLOCK],[-BLOCK,BLOCK]]){
      const pole=new THREE.Mesh(cylGeo, lampPoleMat);
      pole.scale.set(0.25,5,0.25); pole.position.set(x,2.5,z); cityRoot.add(pole);
      const box=new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({color:0x1a1a1a, metalness:0.4, roughness:0.5}));
      box.scale.set(0.45,1.1,0.35); box.position.set(x,5.2,z); cityRoot.add(box);
      const colors=[0xff2222,0xffcc00,0x22cc44];
      colors.forEach((col,i)=>{
        const led=new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({color:col}));
        led.scale.set(0.22,0.22,0.22); led.position.set(x,5.55-i*0.32,z+0.2); cityRoot.add(led);
      });
    }
  }

  /* District signs */
  const signs = [
    ['CENTRAL PARK|中央公园', '#1a5c2e', '#ffffff', 0, 18, -62, 0],
    ['DOWNTOWN|市中心', '#1a2a6c', '#ffdd44', 110, 32, 45, -0.6],
    ['HARBOR|港湾', '#0a4060', '#a8e0ff', -130, 26, 90, 0.9],
    ['5th AVE|第五大道', '#5a1a1a', '#ffffff', 45, 24, -140, 0.2],
    ['MIDTOWN|中城', '#3a2060', '#e0c0ff', -90, 30, -110, 0.4],
  ].slice(0, q.signs);
  for(const [text,bg,fg,x,y,z,yaw] of signs){
    addBillboard(x,y,z,yaw, makeSignTexture(text,bg,fg));
  }

  /* Parked cars */
  const carColors=[0xc04040,0x4060c0,0xe8e8e8,0x2a2a2a,0x40a060,0xd08030];
  for(let i=0;i<q.parked;i++){
    const alongMain=Math.random()>0.5;
    const t=(Math.random()-0.5)*CITY*1.1;
    const side=(Math.random()>0.5?1:-1)*(ROAD_W*0.5+3.5);
    if(Math.abs(t)<60) continue;
    const g=new THREE.Group();
    const col=carColors[i%carColors.length];
    const body=new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({color:col, metalness:0.45, roughness:0.4}));
    body.scale.set(1.7,0.65,3.4); body.position.y=0.55; g.add(body);
    const cabin=new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({color:0x1a2838, metalness:0.5, roughness:0.25, transparent:true, opacity:0.85}));
    cabin.scale.set(1.55,0.5,1.6); cabin.position.set(0,1.0,-0.15); g.add(cabin);
    if(alongMain){ g.position.set(side,0,t); g.rotation.y=0; }
    else { g.position.set(t,0,side); g.rotation.y=Math.PI/2; }
    cityRoot.add(g);
  }

  /* Yellow taxis */
  for(let i=0;i<q.taxis;i++){
    const alongMain = Math.random()>0.5;
    const t = (Math.random()-0.5)*CITY*1.2;
    const lane = (Math.random()>0.5?1:-1)*4.5;
    const g=new THREE.Group();
    const body=new THREE.Mesh(boxGeo, taxiMat);
    body.scale.set(1.6,0.7,3.2); body.position.y=0.55; g.add(body);
    const cabin=new THREE.Mesh(boxGeo, taxiMat);
    cabin.scale.set(1.5,0.55,1.6); cabin.position.set(0,1.05,-0.1); g.add(cabin);
    const top=new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({color:0x222222}));
    top.scale.set(0.5,0.25,0.7); top.position.set(0,1.45,0); g.add(top);
    for(const [wx,wz] of [[0.7,1],[ -0.7,1],[0.7,-1],[-0.7,-1]]){
      const wh=new THREE.Mesh(cylGeo, taxiDark);
      wh.scale.set(0.55,0.25,0.55); wh.rotation.z=Math.PI/2; wh.position.set(wx,0.35,wz); g.add(wh);
    }
    if(alongMain){ g.position.set(lane,0,t); g.rotation.y=0; }
    else { g.position.set(t,0,lane); g.rotation.y=Math.PI/2; }
    cityRoot.add(g);
    taxis.push({
      mesh:g, alongMain, t, lane,
      speed:(2.5+Math.random()*3.5)*(Math.random()>0.5?1:-1),
      yaw: alongMain?0:Math.PI/2
    });
  }
}

function makeTeslaLogoTex(kind){
  // kind: 'T' (badge) or 'word' (TESLA wordmark)
  const c = document.createElement('canvas');
  c.width = kind==='word' ? 512 : 256;
  c.height = kind==='word' ? 128 : 256;
  const g = c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  if(kind==='T'){
    // circular dark badge + red Tesla T
    g.fillStyle = 'rgba(15,18,22,0.92)';
    g.beginPath(); g.arc(128,128,118,0,Math.PI*2); g.fill();
    g.strokeStyle = '#c8cdd3'; g.lineWidth = 6; g.stroke();
    g.fillStyle = '#e31937';
    // stylized Tesla T: wide crossbar + tapered stem
    g.beginPath();
    g.moveTo(48,70); g.lineTo(208,70); g.lineTo(198,98);
    g.lineTo(148,98); g.lineTo(148,198); g.lineTo(108,198);
    g.lineTo(108,98); g.lineTo(58,98); g.closePath();
    g.fill();
    // slight highlight on bar
    g.fillStyle = '#ff4d63';
    g.fillRect(54,72,148,10);
  } else {
    g.fillStyle = '#e31937';
    g.font = 'bold 92px Arial, Helvetica, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('TESLA', 256, 64);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function wedgeGeo(w1, w2, h, len, topScaleFront=0.9, topScaleRear=0.95, frontTopZ=0.78){
  // Angular tapering prism closer to Cybertruck body
  const hw1=w1/2, hw2=w2/2, hh=h/2, hl=len/2;
  const verts = new Float32Array([
    -hw1, -hh,  hl,   hw1, -hh,  hl,   hw2, -hh, -hl,  -hw2, -hh, -hl,
    -hw1*topScaleFront, hh,  hl*frontTopZ,   hw1*topScaleFront, hh,  hl*frontTopZ,
     hw2*topScaleRear, hh, -hl,  -hw2*topScaleRear, hh, -hl,
  ]);
  const idx = [
    0,1,2, 0,2,3,
    4,6,5, 4,7,6,
    0,4,5, 0,5,1,
    1,5,6, 1,6,2,
    2,6,7, 2,7,3,
    3,7,4, 3,4,0,
  ];
  const geo=new THREE.BufferGeometry();
  const pos=[];
  for(let i=0;i<idx.length;i+=3){
    for(let k=0;k<3;k++){
      const vi=idx[i+k]*3;
      pos.push(verts[vi],verts[vi+1],verts[vi+2]);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.computeVertexNormals();
  return geo;
}

(function bindJoy(el,knob){
  let active=false,pid=null,cx,cy; const R=44;
  function setFrom(x,y){
    let dx=x-cx,dy=y-cy; const len=Math.hypot(dx,dy)||1;
    if(len>R){dx=dx/len*R;dy=dy/len*R;}
    knob.style.transform=`translate(${dx}px,${dy}px)`;
    mobile.steer=-dx/R;
    if(dy<0){mobile.throttle=-dy/R;mobile.brake=0;} else {mobile.brake=dy/R;mobile.throttle=0;}
  }
  function clear(){mobile.throttle=mobile.brake=mobile.steer=0;knob.style.transform='translate(0,0)';}
  el.addEventListener('pointerdown',e=>{active=true;pid=e.pointerId;el.setPointerCapture(pid);const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;setFrom(e.clientX,e.clientY);});
  el.addEventListener('pointermove',e=>{if(active&&e.pointerId===pid)setFrom(e.clientX,e.clientY);});
  el.addEventListener('pointerup',e=>{if(e.pointerId===pid){active=false;clear();}});
  el.addEventListener('pointercancel',()=>{active=false;clear();});
})(joyMove,joyKnob);

let camMode=0;
const camSmooth=new THREE.Vector3(0,8,38);
const lookSmooth=new THREE.Vector3(0,1,0);
function cycleCamera(){
  camMode=(camMode+1)%3;
  toast('视角：'+['追逐','驾驶舱','高空'][camMode]);
}
function updateCamera(dt){
  const fx=-Math.sin(carState.yaw), fz=-Math.cos(carState.yaw);
  const pos=car.position;
  let dx,dy,dz,lx,ly,lz;
  if(camMode===0){ dx=pos.x-fx*12; dy=pos.y+4.5; dz=pos.z-fz*12; lx=pos.x+fx*8; ly=pos.y+1.3; lz=pos.z+fz*8; }
  else if(camMode===1){ dx=pos.x+fx*0.2; dy=pos.y+1.45; dz=pos.z+fz*0.2; lx=pos.x+fx*18; ly=pos.y+1.1; lz=pos.z+fz*18; }
  else { dx=pos.x-fx*5; dy=pos.y+28; dz=pos.z-fz*5; lx=pos.x; ly=pos.y; lz=pos.z; }
  const k=1-Math.pow(0.0008,dt);
  const kk=camMode===1?Math.min(1,k*2):k;
  camSmooth.x+=(dx-camSmooth.x)*kk; camSmooth.y+=(dy-camSmooth.y)*kk; camSmooth.z+=(dz-camSmooth.z)*kk;
  lookSmooth.x+=(lx-lookSmooth.x)*k; lookSmooth.y+=(ly-lookSmooth.y)*k; lookSmooth.z+=(lz-lookSmooth.z)*k;
  camera.position.copy(camSmooth);
  camera.lookAt(lookSmooth);
}

    if(q.lampLights>0){

      buildingMatBrick.map=dayBrick; buildingMatBrick.emissiveMap=dayBrick; buildingMatBrick.emissiveIntensity=0.06; buildingMatBrick.needsUpdate=true;

function applyQuality(name, rebuild){
  quality=name;
  localStorage.setItem('fcc_quality', quality);
  const q=QUAL[quality];
  renderer.setPixelRatio(Math.min(devicePixelRatio, q.pr));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.toneMapping = q.tone>=2 ? THREE.ACESFilmicToneMapping : (q.tone===1 ? THREE.LinearToneMapping : THREE.NoToneMapping);
  renderer.toneMappingExposure = isNight ? 1.0 : 1.08;
  renderer.shadowMap.enabled=q.shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  sun.castShadow=q.shadows;
  if(q.shadows){
    sun.shadow.mapSize.set(q.shadowSize,q.shadowSize);
    const sc=sun.shadow.camera;
    sc.near=10; sc.far=520; sc.left=-180; sc.right=180; sc.top=180; sc.bottom=-180;
    sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.04;
    sun.position.set(160,260,80);
  }
  if(car){
    car.traverse(o=>{ if(o.isMesh){ o.castShadow=q.shadows; o.receiveShadow=q.shadows; }});
  }
  camera.far=q.far; camera.updateProjectionMatrix();
  const texSize = quality==='high'?48 : quality==='med'?32 : 20;
  if(dayGlass){ dayGlass.dispose(); nightGlass.dispose(); dayBrick.dispose(); nightBrick.dispose(); }
  dayGlass=makeWindowTexture(false, texSize, 'glass');
  nightGlass=makeWindowTexture(true, texSize, 'glass');
  dayBrick=makeWindowTexture(false, texSize, 'brick');
  nightBrick=makeWindowTexture(true, texSize, 'brick');
  if(!asphaltTex){ asphaltTex=makeAsphaltTex(); sidewalkTex=makeSidewalkTex(); skyDayTex=makeSkyTex(false); skyNightTex=makeSkyTex(true); }
  skyMat.map = isNight ? skyNightTex : skyDayTex; skyMat.needsUpdate=true;
  roadMat.map=asphaltTex; sidewalkMat.map=sidewalkTex;
  if(rebuild) buildCity(q);
  else {
    if(buildingMatGlass){
      buildingMatGlass.map=isNight?nightGlass:dayGlass; buildingMatGlass.emissiveMap=buildingMatGlass.map; buildingMatGlass.needsUpdate=true;
      buildingMatBrick.map=isNight?nightBrick:dayBrick; buildingMatBrick.emissiveMap=buildingMatBrick.map; buildingMatBrick.needsUpdate=true;
    }
  }
  setDayNight(isNight);
  document.querySelectorAll('.quality button').forEach(b=> b.classList.toggle('on', b.dataset.q===quality));
  qualBtn.textContent='画质:'+({high:'高',med:'中',low:'低'}[quality]);
}

function spawnRings(){

  for(let i=0;i<path.length;i++){

/* ========== PHYSICS ========== */
function resolveCollisions(){
  const hw=1.2, hd=2.5, y=carState.y;
  const minx=carState.x-hw, maxx=carState.x+hw, minz=carState.z-hd, maxz=carState.z+hd;
  const maxy=y+1.5;
  for(let i=0;i<colliders.length;i++){
    const b=colliders[i];
    if(maxx<b.minx||minx>b.maxx||maxz<b.minz||minz>b.maxz||maxy<b.miny||y>b.maxy) continue;
    const ox=Math.min(maxx-b.minx, b.maxx-minx);
    const oz=Math.min(maxz-b.minz, b.maxz-minz);
    const oy=Math.min(maxy-b.miny, b.maxy-y);
    if(oy<ox && oy<oz){
      if(y+(maxy-y)*0.5 < (b.miny+b.maxy)*0.5){ carState.y-=oy+0.05; carState.vert=Math.min(carState.vert,-1); }
      else { carState.y+=oy+0.05; carState.vert=Math.max(carState.vert,1); }
    } else if(ox<oz){
      carState.x += (carState.x>(b.minx+b.maxx)*0.5 ? 1 : -1)*(ox+0.05);
      carState.speed*=-0.25;
    } else {
      carState.z += (carState.z>(b.minz+b.maxz)*0.5 ? 1 : -1)*(oz+0.05);
      carState.speed*=-0.25;
    }
    carState.speed*=0.55;
    car.position.set(carState.x,carState.y,carState.z);
    break;
  }
}

function updateCar(dt){
  readKeys();
  const maxSpeed=52, accel=28, brakeForce=40, fric=8;
  if(input.throttle) carState.speed += accel*dt*(carState.speed<0?1.4:1);
  if(input.brake){
    if(carState.speed>0.8) carState.speed-=brakeForce*dt;
    else carState.speed-=accel*0.6*dt;
  }
  if(!input.throttle && !input.brake){
    if(carState.speed>0) carState.speed=Math.max(0,carState.speed-fric*dt);
    else if(carState.speed<0) carState.speed=Math.min(0,carState.speed+fric*dt);
  }
  carState.speed=THREE.MathUtils.clamp(carState.speed,-16,maxSpeed);
  const steerEff=input.steer*2.0*Math.min(1,Math.abs(carState.speed)/8);
  if(Math.abs(carState.speed)>0.3) carState.yaw+=steerEff*dt*Math.sign(carState.speed||1);
  carState.steer += (input.steer*0.45-carState.steer)*(1-Math.pow(0.01,dt));

  if(input.up){ carState.vert+=22*dt; carState.flying=true; }
  else if(input.down){ carState.vert-=22*dt; carState.flying=true; }
  else { carState.vert*=Math.pow(0.02,dt); if(Math.abs(carState.vert)<0.05) carState.vert=0; }
  carState.vert=THREE.MathUtils.clamp(carState.vert,-32,32);
  carState.y+=carState.vert*dt;
  if(carState.y<=0.95){ carState.y=0.95; if(carState.vert<0) carState.vert=0; carState.flying=false; }
  carState.y=Math.min(carState.y,160);

  const fx=-Math.sin(carState.yaw), fz=-Math.cos(carState.yaw);
  carState.x+=fx*carState.speed*dt; carState.z+=fz*carState.speed*dt;
  const lim=CITY*0.95;
  carState.x=THREE.MathUtils.clamp(carState.x,-lim,lim);
  carState.z=THREE.MathUtils.clamp(carState.z,-lim,lim);

  car.position.set(carState.x,carState.y,carState.z);
  car.rotation.y=carState.yaw;
  car.rotation.z=-carState.steer*0.14;
  car.rotation.x=THREE.MathUtils.clamp(-carState.vert*0.01,-0.12,0.12);

  const spin=carState.speed*dt*1.5;
  for(const w of car.userData.wheels) w.rotation.x+=spin;

  const th=car.userData.thruster;
  const want=carState.flying?Math.min(0.65,0.2+Math.abs(carState.vert)*0.015):0;
  th.material.opacity += (want-th.material.opacity)*(1-Math.pow(0.01,dt));

  resolveCollisions();
}

let playing=false, paused=false, last=performance.now();
let fpsFrames=0, fpsLast=performance.now();
let hudAcc=0;

function resetCar(){
  Object.assign(carState,{x:0,y:0.95,z:24,yaw:0,speed:0,vert:0,flying:false,steer:0});
  car.position.set(0,0.95,24); car.rotation.set(0,0,0);
  camSmooth.set(0,9,40); lookSmooth.set(0,1,0); camera.position.copy(camSmooth);
}
function startMode(m){
  mode=m; score=0; elScore.textContent='0'; missionDone=false;
  menuEl.classList.add('hidden');
  menuBtn.style.display='inline-block'; qualBtn.style.display='inline-block';
  playing=true; paused=false; pauseOverlay.classList.remove('show');
  resetCar(); clearMissionObjects();
  if(m==='free'){
    missionBox.style.display='block'; mTitle.textContent='自由驾驶 · Free Drive';
    mDesc.textContent='Central Park 起飞 · 空格飞行 · 撞楼弹开'; toast('自由驾驶 · Central Park');
  } else if(m==='rings'){
    spawnRings(); ringStartTime=performance.now();
    missionBox.style.display='block'; mTitle.textContent='霓虹环竞速';
    mDesc.textContent=`环门 1 / ${rings.length}`; toast('穿过发光环门！');
  } else {
    spawnCoins();
    missionBox.style.display='block'; mTitle.textContent='金币寻宝';
    mDesc.textContent=`剩余金币 ${coins.length}`; toast('收集漂浮金币！');
  }
}
function backToMenu(){
  playing=false; paused=false; pauseOverlay.classList.remove('show');
  menuEl.classList.remove('hidden'); menuBtn.style.display='none'; qualBtn.style.display='none';
  missionBox.style.display='none'; clearMissionObjects();
}
function togglePause(){ if(!playing) return; paused=!paused; pauseOverlay.classList.toggle('show',paused); }

document.querySelectorAll('.modes button').forEach(btn=>btn.addEventListener('click',()=>startMode(btn.dataset.mode)));
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('toMenuBtn').addEventListener('click', backToMenu);
menuBtn.addEventListener('click', backToMenu);
qualBtn.addEventListener('click', ()=>{
  const order=['low','med','high'];
  applyQuality(order[(order.indexOf(quality)+1)%3], true);
  toast('画质：'+({high:'高',med:'中',low:'低'}[quality]));
});
document.querySelectorAll('.quality button').forEach(btn=>{
  btn.addEventListener('click', ()=>{ applyQuality(btn.dataset.q, true); toast('画质：'+({high:'高',med:'中',low:'低'}[quality])); });
});

window.addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
});

function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  fpsFrames++;
  if(now-fpsLast>=500){
    const fps=Math.round(fpsFrames*1000/(now-fpsLast));
    fpsEl.textContent=fps+' FPS · '+({high:'高',med:'中',low:'低'}[quality]);
    fpsFrames=0; fpsLast=now;
  }
  if(playing && !paused){
    updateCar(dt);
    updateMission(dt);
    updateTaxis(dt);
    updateCamera(dt);
    hudAcc+=dt;
    if(hudAcc>0.1){
      hudAcc=0;
      elSpd.textContent=(Math.abs(carState.speed)*3.6)|0;
      elAlt.textContent=Math.max(0,(carState.y-0.95)|0);
      speedFill.style.width=Math.min(100,(Math.abs(carState.speed)/52)*100)+'%';
    }
  } else if(!playing){
    const t=now*0.00012;
    camera.position.set(Math.sin(t)*52, 26, Math.cos(t)*52);
    camera.lookAt(0,6,0);
  }
  renderer.render(scene, camera);
}

try{
  applyQuality(quality, true);
}catch(e){
  console.error(e);
  try{ toast('场景构建出错，已降级启动'); }catch(_){}
}
try{
  const q=new URLSearchParams(location.search).get('mode');
  if(q==='free'||q==='rings'||q==='coins') setTimeout(()=>startMode(q),150);
}catch(e){}
requestAnimationFrame(tick);
</script>
</body>
</html>
